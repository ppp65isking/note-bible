name: Build Android APK

# Builds the native Android app (Capacitor shell around the web app) and
# uploads the installable APK as an artifact. Debug APK: installs directly
# on a phone, no signing key needed for sideloading.
# NOTE: the android/ native project is GENERATED in this workflow
# (`npx cap add android`) and is NOT committed — it contains binary files
# (gradle wrapper jar, launcher/splash PNGs) that can't go through the
# text-based push path. The workflow regenerates it from the template
# every run, then syncs the web files into it.
# Two things are layered onto the generated project before the Gradle
# build: (1) app icons + splash, generated from icons/icon-512.png by
# @capacitor/assets (otherwise the app ships Capacitor's default icon);
# (2) google-services.json, decoded from the ANDROID_GOOGLE_SERVICES_JSON
# secret (never committed) so native Google sign-in works. The Google
# Services Gradle plugin is applied automatically by the Capacitor
# template whenever android/app/google-services.json exists.
# (3) The APK is signed with the app's persistent keystore (decoded from
# the ANDROID_KEYSTORE_BASE64 secret) so its SHA-1 matches the one in
# Firebase — without this, native Google sign-in fails with
# DEVELOPER_ERROR. If the keystore secrets aren't set yet, the build
# falls back to the runner's throwaway debug key (icon/splash still
# fine, Google sign-in just won't work in that APK).
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'manifest.json'
      - 'sw.js'
      - 'icons/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-www.mjs'
      - 'scripts/prepare-assets.mjs'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # The runner image already ships an Android SDK (ANDROID_HOME is set by
    # default). Do NOT use android-actions/setup-android@v3: it internally
    # runs `sdkmanager tools`, and the obsolete "tools" package no longer
    # exists, so it fails (build #1 died in 26s on that step). We install
    # the packages we need explicitly below.
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Build web files into www/
        run: npm run build:www

      - name: Create Android project
        run: npx cap add android

      # @capacitor-firebase/authentication only links the Google Sign-In
      # libraries when the project opts in (otherwise they are compileOnly
      # and sign-in crashes at runtime). variables.gradle is generated by
      # `cap add android`, so the flag is added here, every run.
      - name: Enable Google Sign-In deps for Firebase Auth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/variables.gradle')
          t = p.read_text()
          if 'rgcfaIncludeGoogle' not in t:
              p.write_text(t.replace('ext {\n', 'ext {\n    rgcfaIncludeGoogle = true\n', 1))
          PY

      # Generates the launcher icon (all densities) + splash from our own
      # icons/icon-512.png. Without this the app ships Capacitor's default
      # icon (or none). Runs after `cap add android` (needs android/ to
      # exist) and before `cap sync` (which never touches res/).
      - name: Generate app icons
        run: npm run assets:generate

      # Native Google sign-in needs google-services.json in android/app/.
      # It comes from the ANDROID_GOOGLE_SERVICES_JSON repo secret (base64
      # of the file) and is never committed. If the secret isn't set yet
      # the step is a no-op and the build still succeeds — Google sign-in
      # just won't work in that APK.
      - name: Add google-services.json (native Google sign-in)
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "$ANDROID_GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          fi

      # Persistent signing key for this app (base64 PKCS#12 keystore).
      # The debug keystore CI generates fresh every run has a different
      # SHA-1 each time, which Firebase rejects for Google sign-in — so
      # the APK must be signed with this key, whose SHA-1 is registered
      # in Firebase. Never committed; no-op if the secret isn't set yet.
      - name: Add signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/verse-garden.keystore
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -f app/verse-garden.keystore ] && [ -n "$ANDROID_KEYSTORE_STORE_PASSWORD" ] && [ -n "$ANDROID_KEYSTORE_KEY_PASSWORD" ]; then
            ./gradlew assembleDebug \
              -Pandroid.injected.signing.store.file="$PWD/app/verse-garden.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias=versegarden \
              -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_KEY_PASSWORD"
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verse-garden-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
